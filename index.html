  <title>NetLab — симулятор сетей</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Cpath d='M8 22V10l8 8 8-8v12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M8 22V10l8 8 8-8v12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>NetLab</span>
      </div>
      <nav class="menu" id="menu"></nav>
      <div class="spacer"></div>
      <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="Режим">
        <button data-mode="realtime" role="tab" title="Реальное время (R)">Реальное время</button>
        <button data-mode="sim" role="tab" title="Режим симуляции (S)">Симуляция</button>
      </div>
    </header>

    <div id="main">
      <aside id="toolbar"></aside>
      <section id="stageWrap">
        <svg id="stage" tabindex="0" aria-label="Рабочая область"></svg>
        <div id="stageHint" class="stage-hint"></div>
        <div id="zoomCtl" class="zoom-ctl"></div>
      </section>
      <aside id="simPanel" hidden></aside>
    </div>

    <footer id="bottom">
      <div id="pduPanel"></div>
      <div id="statusbar"></div>
    </footer>
  </div>

  <div id="windows"></div>
  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>
